<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>商户后台 · 示例商城</title>
    <style>
      body { margin: 0; font: 14px/1.6 "PingFang SC", system-ui, sans-serif; color: #1f2328; background: #f7f6f3; }
      main { max-width: 640px; margin: 24px auto; padding: 20px 24px; background: #fff; border: 1px solid #e4e1da; border-radius: 12px; display: grid; gap: 12px; }
      label { display: grid; gap: 4px; }
      input { height: 32px; padding: 0 8px; border: 1px solid #d2cec5; border-radius: 6px; }
      button { height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid #2f5bd3; background: #2f5bd3; color: #fff; }
      #balance { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h2>退款设置</h2>
      <p>可退金额：<span id="balance">¥300.00</span></p>
      <label>商户号<input id="merchant" name="merchant" /></label>
      <label>操作密码<input id="password" type="password" /></label>
      <label>短信验证码<input id="sms" name="sms" /></label>
      <button id="grant" aria-label="开通退款">开通</button>
      <a id="next" href="record-fixture.html?step=2">查看商户详情</a>
      <div id="result"></div>
    </main>
    <script>
      document.getElementById("grant").addEventListener("click", async () => {
        const body = JSON.stringify({ merchant: document.getElementById("merchant").value, password: document.getElementById("password").value });
        const response = await fetch("/e2e/pick-data.json?access_token=abc-secret&from=record", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer abc-secret" }, body });
        document.getElementById("result").textContent = String(response.status);
      });
    </script>
  </body>
</html>
