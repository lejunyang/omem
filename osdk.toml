# omem foundation: one TypeScript runtime for Vue, API and CLI/ACP bridges.
[tools]
node = "24.18.1"
pnpm = "11"

[models.memory-zh.views]

[deps.pnpm]
auto = true
allow_build_from_source = true

[skills.osdk-guide]
source = "github:lejunyang/one-sdk"
skill = "osdk-guide"
ref = "02a2f2b3142ded7d73554aaee629a24966a62313"
agents = ["universal", "claude-code"]

[tasks]
dev = "pnpm run dev"
"dev:review" = "pnpm run dev:review"
"retrieval:index" = "pnpm exec tsx scripts/retrieval-index.ts"
"retrieval:verify" = "pnpm exec tsx scripts/live-retrieval-smoke.ts"
"review:build" = "pnpm exec tsx scripts/review-wiki.ts"
"review:analyze" = "pnpm exec tsx scripts/review-knowledge.ts"
"review:generate" = "pnpm exec tsx scripts/review-knowledge.ts"
build = "pnpm run build"
test = "pnpm run test"
typecheck = "pnpm run typecheck"
start = "pnpm run start"
[tasks.check]
run = ["pnpm run typecheck", "pnpm run test", "pnpm run build"]

[tasks.browser]
run = "pnpm run test:browser"
[tasks.live-acp]
run = "pnpm exec tsx scripts/live-acp-smoke.ts"
[tasks.live-role]
run = "pnpm run test:live-role"
[tasks.live-learning]
run = "pnpm run test:live-learning"
[tasks.live-pipeline]
run = "pnpm run test:live-pipeline"
[tasks.live-lark-host]
run = "pnpm run test:live-lark-host"
[tasks.quality-lark-annotate]
run = "pnpm run quality:lark-annotate"
[tasks.quality-evaluate]
run = "pnpm run quality:evaluate"
[tasks.quality-run]
run = "pnpm run quality:run"

[models.memory-zh]
source = "hf:Xenova/bge-small-zh-v1.5@75c43b069aac4d136ba6bc1122f995fedcfd2781"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "vocab.txt", "onnx/model_quantized.onnx"]
exclude = []
kind = "embedding"
family = "bge"
derived_from = "BAAI/bge-small-zh-v1.5"
