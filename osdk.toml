# Bun runs TypeScript scripts; Node runs the compiled server and build tools.
[tools]
node = "24.18.1"
pnpm = "11"
bun = "1.4.2"

[models.decision-plumb4b-q4.views]

[models.decision-plumb4b.views]

[models.decision-gliclass.views]

[models.decision-qwen4b.views]

[models.decision-gliclass]
source = "hf:knowledgator/gliclass-multilang-mini@0bd888b6c3ef9fca5f0a9d407bddfbbc7623486b"
include = ["*.json", "*.safetensors", "spm.model"]
exclude = []
variant = "bf16"
kind = "other"
family = "gliclass"

[models.relevance-zh-v2.views]

[models.relevance-zh.views]

[models.memory-zh.views]

[models.decision-plumb4b-q4]
source = "hf:crh225/plumb-4b-GGUF@71c1c57e523219124f7be9c486d475d19891185f"
include = ["plumb-4b-v5-Q4_K_M.gguf", "LICENSE", "NOTICE"]
exclude = []
variant = "gguf-q4-k-m"
kind = "other"
family = "qwen3.5"
derived_from = "crh225/plumb-4b"

[models.decision-plumb4b]
source = "hf:crh225/plumb-4b-GGUF@71c1c57e523219124f7be9c486d475d19891185f"
include = ["plumb-4b-v5-Q8_0.gguf", "LICENSE", "NOTICE"]
exclude = []
variant = "gguf-q8"
kind = "other"
family = "qwen3.5"
derived_from = "crh225/plumb-4b"

[models.decision-qwen4b]
source = "hf:mlx-community/Qwen3.5-4B-4bit@0e7ffd5c629ef7719d4cbc04069232580bfa9d9c"
include = ["*.json", "*.safetensors", "*.jinja"]
exclude = []
variant = "mlx-q4"
kind = "other"
family = "qwen3.5"
derived_from = "Qwen/Qwen3.5-4B"

[models.relevance-zh-v2]
source = "hf:onnx-community/bge-reranker-v2-m3-ONNX@6f5ff65298512715a1e669753bc754d2bc8f367b"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "onnx/model_quantized.onnx"]
exclude = []
variant = "q8"
kind = "other"
family = "bge-reranker"
derived_from = "BAAI/bge-reranker-v2-m3"

[models.relevance-zh]
source = "hf:Xenova/bge-reranker-base@280bcc27a84e0b898c251e06fddb25171bd9b101"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "onnx/model_quantized.onnx"]
exclude = []
variant = "q8"
kind = "other"
family = "bge-reranker"
derived_from = "BAAI/bge-reranker-base"

[deps.pnpm]
auto = true
allow_build_from_source = true

[skills.osdk-guide]
source = "github:lejunyang/one-sdk"
skill = "osdk-guide"
ref = "02a2f2b3142ded7d73554aaee629a24966a62313"
agents = ["universal", "claude-code"]

[tasks]
dev = "pnpm run dev"
"knowledge:verify" = "bun scripts/live-knowledge-smoke.ts"
"knowledge:native-verify" = "bun scripts/live-native-knowledge-smoke.ts"
build = "pnpm run build"
test = "pnpm run test"
typecheck = "pnpm run typecheck"
start = "pnpm run start"
[tasks."retrieval:verify"]
run = "bun scripts/live-retrieval-smoke.ts"
[tasks."retrieval:verify".flags.reranker]
help = "Compare the installed Chinese cross-encoder (not enabled by default)"

[tasks.check]
run = ["pnpm run typecheck", "pnpm run test", "pnpm run build"]

[tasks."assistant:memory-flow"]
run = "bun scripts/assistant-memory-flow.ts"
description = "Verify captured material, native assistant research, memory refresh and ongoing follow-up with real Traex"

[tasks."assistant:compare"]
run = "bun scripts/assistant-compare.ts"
description = "Compare real answering agents on a frozen material corpus; consumes model calls"
[tasks."assistant:compare".options.questions]
help = "JSON file containing [{id, turns: [question, follow-up]}]"
[tasks."assistant:compare".options.models]
default = "gpt-5.6-sol"
help = "Comma-separated model IDs; each is validated through ACP"
[tasks."assistant:compare".options.effort]
default = "medium"
help = "Reasoning effort validated through ACP"
[tasks."assistant:compare".options.reading-model]
help = "Also compare a material-first reader with the normal model as investigation fallback"
[tasks."assistant:compare".options.reading-effort]
default = "auto"
help = "auto discovers the lowest advertised none/minimal/low effort; explicit values are validated"
[tasks."assistant:compare".options.variant]
default = "both"
choices = ["both", "research", "reading-first"]
help = "Run both paths, or replay one path without repeating a completed baseline"
[tasks."assistant:compare".options.data]
help = "Source data directory; defaults to personal data or isolated review data"
[tasks."assistant:compare".options.output]
help = "Fresh output directory; defaults to an ignored runtime directory"
[tasks."assistant:compare".flags.review]
help = "Use the repository input adapter and its captured knowledge"

[tasks.browser]
run = "pnpm run test:browser"
[tasks.live-daily]
run = "bun scripts/live-daily-smoke.ts"

[tasks.live-acp]
run = "bun scripts/live-acp-smoke.ts"

[tasks."decision:prepare"]
description = "Install optional local decision-model dependencies in an isolated runtime"
run = [{ argv = ["bun", "scripts/decision-prepare.ts"] }]

[tasks."decision:inspect"]
description = "Read-only local advice before and after real HTTP retrieval; never applies actions"
run = [{ argv = ["bun", "scripts/decision-inspect.ts", "{{args}}"] }]
[[tasks."decision:inspect".args]]
name = "question"
help = "Current user question"
[tasks."decision:inspect".options.api]
help = "Running omem API base URL"
[tasks."decision:inspect".options.query]
help = "Explicit search query when the question needs conversation context"
[tasks."decision:inspect".options.context]
help = "File containing relevant prior conversation or current selection"
[tasks."decision:inspect".options.model]
default = "decision-plumb4b"
help = "Installed osdk model alias"
[tasks."decision:inspect".options.backend]
help = "gliclass, mlx or gguf; inferred for standard aliases"
[tasks."decision:inspect".options.output]
help = "Replace this current report"

[tasks."decision:evaluate"]
description = "Compare local models on a fixed Chinese decision suite; completion is not acceptance"
run = [{ argv = ["bun", "scripts/decision-evaluate.ts", "{{args}}"] }]
[tasks."decision:evaluate".options.model]
default = "decision-gliclass"
help = "Installed osdk model alias"
[tasks."decision:evaluate".options.backend]
help = "gliclass, mlx or gguf; inferred for standard aliases"
[tasks."decision:evaluate".options.cases]
help = "Evaluation JSON file; never captured as source material"
[tasks."decision:evaluate".options.output]
help = "Replace this current report instead of accumulating runs"
[tasks."decision:evaluate".options.rotations]
default = "2"
help = "Option-order controls, from 1 to 4"
[tasks."decision:evaluate".options.device]
default = "cpu"
help = "GLiClass device: cpu or mps; MLX uses Metal"
[tasks."decision:evaluate".options.readout]
default = "classification"
choices = ["classification", "query-label"]
help = "GLiClass query-label evaluates native relevance ranking, not decision accuracy"
[tasks.live-role]
run = "pnpm run test:live-role"
[tasks.live-learning]
run = "pnpm run test:live-learning"
[tasks.live-pipeline]
run = "pnpm run test:live-pipeline"
[tasks.live-lark-host]
run = "pnpm run test:live-lark-host"
[tasks.quality-lark-annotate]
run = "pnpm run quality:lark-annotate"
[tasks.quality-evaluate]
run = "pnpm run quality:evaluate"
[tasks.quality-run]
run = "pnpm run quality:run"

[models.memory-zh]
source = "hf:Xenova/bge-small-zh-v1.5@75c43b069aac4d136ba6bc1122f995fedcfd2781"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "vocab.txt", "onnx/model_quantized.onnx"]
exclude = []
kind = "embedding"
family = "bge"
derived_from = "BAAI/bge-small-zh-v1.5"

[tasks."retrieval:index"]
run = [{ argv = ["bun", "scripts/retrieval-index.ts", "{{args}}"] }]

[tasks."retrieval:index".flags.review]
help = "Use the isolated repository database"

[tasks."review:verify"]
run = [{ argv = ["bun", "scripts/review-verify.ts", "{{args}}"] }]

[tasks."review:verify".flags.full]
help = "Run dependencies, complete project checks and live Chinese retrieval"

[tasks."review:prune"]
description = "Preview redundant review reports and completed temporary runs"
run = [{ argv = ["bun", "scripts/review-prune.ts", "{{args}}"] }]

[tasks."review:prune".flags.apply]
help = "Remove only the listed redundant verification outputs"

[tasks."review:build"]
run = [{ argv = ["bun", "scripts/review-wiki.ts", "{{args}}"] }]

[[tasks."review:build".args]]
name = "target"
default = ""
help = "File or directory to process; omit for all materials"

[tasks."review:build".flags.generate]
help = "Generate missing Wiki descriptions with the configured model"

[tasks."review:analyze"]
run = [{ argv = ["bun", "scripts/review-knowledge.ts", "{{args}}"] }]

[[tasks."review:analyze".args]]
name = "target"
default = ""
help = "File or directory to process; omit for all materials"

[tasks."review:analyze".flags.modules]
help = "Update affected modules and existing ancestors"

[tasks."review:analyze".flags.files-only]
help = "Only analyze source materials"

[tasks."review:analyze".flags.retry]
help = "Retry unfinished model work"

[tasks."review:generate"]
run = [{ argv = ["bun", "scripts/review-knowledge.ts", "{{args}}"] }]

[[tasks."review:generate".args]]
name = "target"
default = ""
help = "File or directory to process; omit for all materials"

[tasks."review:generate".flags.modules]
help = "Update affected modules and existing ancestors"

[tasks."review:generate".flags.files-only]
help = "Only analyze source materials"

[tasks."review:generate".flags.retry]
help = "Retry unfinished model work"

[tasks."review:guides"]
run = [{ argv = ["bun", "scripts/review-guides.ts", "{{args}}"] }]
description = "Investigate and write reader-oriented repository guides with real ACP"

[[tasks."review:guides".args]]
name = "target"
default = ""
help = "Page key (overview, capture, retrieval, memory, contributing); omit for all"

[tasks."review:guides".flags.retry]
help = "Retry failed investigation or writing"

[tasks."review:catalog"]
run = [{ argv = ["bun", "scripts/review-catalog.ts", "{{args}}"] }]
description = "Read fixed materials with ACP and save editable roles and concept entries"

[[tasks."review:catalog".args]]
name = "target"
default = ""
help = "Captured file or directory; omit for all materials"

[tasks."review:catalog".flags.documents]
help = "Describe Markdown documents only"

[tasks."review:catalog".flags.retry]
help = "Re-analyze model descriptions; preserve user corrections"
