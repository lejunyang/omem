# osdk manages the toolchain, dependencies, models and agent skills for omem.
# Node runs everything (TypeScript is executed directly via type stripping).
[tools]
node = "24.18.1"
pnpm = "11"

[models.rerank-m3.views]

[models.decision-2b.views]

[models.memory-m3.views]

[tasks]
dev = "pnpm run dev"
build = "pnpm run build"
start = "pnpm run start"
test = "pnpm run test"
typecheck = "pnpm run typecheck"

[tasks.check]
run = ["pnpm run typecheck", "pnpm run test", "pnpm run build"]

[tasks.upgrade]
description = "Pull the latest source, install deps, build, and link the global omem (npm install -g .); add --restart to restart the background service"
run = [{ argv = ["node", "scripts/upgrade.ts", "{{args}}"] }]

[tasks.screens]
description = "Screenshot the running web UI at desktop and phone widths (needs a running dev server)"
run = "node scripts/screens.ts"

[tasks."eval:retrieval"]
description = "BEIR-style retrieval evaluation of the search layer on a JSONL corpus/queries pair"
run = "node scripts/eval-retrieval.ts"

[models.docling-tables.views]

[models.docling-layout.views]

[models.memory-zh.views]

[models.rerank-m3]
source = "hf:onnx-community/bge-reranker-v2-m3-ONNX@6f5ff65298512715a1e669753bc754d2bc8f367b"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "onnx/model_quantized.onnx"]
exclude = []
kind = "other"
family = "bge-reranker"
derived_from = "BAAI/bge-reranker-v2-m3"

[models.decision-2b]
source = "hf:startlux-models/StartLux-Decision-2B-Q8_0-GGUF@main"
include = []
exclude = []
kind = "other"
family = "startlux-decision"

[models.memory-m3]
source = "hf:Xenova/bge-m3@main"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "onnx/model_quantized.onnx"]
exclude = []
kind = "embedding"
family = "bge"

[models.docling-tables]
source = "hf:docling-project/docling-models@fc0f2d45e2218ea24bce5045f58a389aed16dc23"
include = ["config.json", "model_artifacts/tableformer/accurate/*"]
exclude = []
kind = "other"
family = "docling"

[models.docling-layout]
source = "hf:docling-project/docling-layout-heron@8f39ad3c0b4c58e9c2d2c84a38465abf757272d8"
include = ["*.json", "*.safetensors"]
exclude = []
kind = "other"
family = "docling"

[deps.pnpm]
auto = true
# The workspace also has the docs site and the VS Code extension; the app needs only its own.
# confirmModulesPurge=false: without a TTY (remote update, services) pnpm aborts instead of asking.
run = "pnpm install --frozen-lockfile --filter omem-assistant --config.confirmModulesPurge=false"
allow_build_from_source = true
# osdk does not pick a registry for a custom `run`, so this one names it itself: the same variables osdk
# sets for pnpm, and the same registry as [registries.npm] below (keep the two in step).
env = { npm_config_registry = "https://registry.npmmirror.com/", pnpm_config_registry = "https://registry.npmmirror.com/" }

# omem's dependencies are all public packages: install them from one public registry, whatever a
# machine's .npmrc or pnpm settings point at. A company mirror can lack a version, or the publish time
# pnpm's release-age check needs, and then installing fails. Scopes and credentials stay native.
# This covers npm / pnpm run through osdk here (`osdk exec`, shims); the install above sets it in env.
[settings.precedence]
npm = "osdk"

[registries.npm]
default = "https://registry.npmmirror.com/"

[skills.osdk-guide]
source = "github:lejunyang/one-sdk"
skill = "osdk-guide"
ref = "02a2f2b3142ded7d73554aaee629a24966a62313"
agents = ["universal", "claude-code"]

[skills.lieflat-less-ai-tone]
source = "github:larashero3-dotcom/lieflat-less-ai-tone"
skill = "lieflat-less-ai-tone"
ref = "branch:main"
agents = ["universal"]

[models.memory-zh]
source = "hf:Xenova/bge-small-zh-v1.5@75c43b069aac4d136ba6bc1122f995fedcfd2781"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "vocab.txt", "onnx/model_quantized.onnx"]
exclude = []
kind = "embedding"
family = "bge"
derived_from = "BAAI/bge-small-zh-v1.5"
