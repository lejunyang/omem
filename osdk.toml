# Bun runs TypeScript scripts; Node runs the compiled server and build tools.
[tools]
node = "24.18.1"
pnpm = "11"
bun = "1.4.2"

[models.memory-zh.views]

[deps.pnpm]
auto = true
allow_build_from_source = true

[skills.osdk-guide]
source = "github:lejunyang/one-sdk"
skill = "osdk-guide"
ref = "02a2f2b3142ded7d73554aaee629a24966a62313"
agents = ["universal", "claude-code"]

[tasks]
dev = "pnpm run dev"
"dev:review" = "pnpm run dev:review"
"retrieval:verify" = "bun scripts/live-retrieval-smoke.ts"
build = "pnpm run build"
test = "pnpm run test"
typecheck = "pnpm run typecheck"
start = "pnpm run start"
[tasks.check]
run = ["pnpm run typecheck", "pnpm run test", "pnpm run build"]

[tasks.browser]
run = "pnpm run test:browser"
[tasks.live-daily]
run = "bun scripts/live-daily-smoke.ts"

[tasks.live-acp]
run = "bun scripts/live-acp-smoke.ts"
[tasks.live-role]
run = "pnpm run test:live-role"
[tasks.live-learning]
run = "pnpm run test:live-learning"
[tasks.live-pipeline]
run = "pnpm run test:live-pipeline"
[tasks.live-lark-host]
run = "pnpm run test:live-lark-host"
[tasks.quality-lark-annotate]
run = "pnpm run quality:lark-annotate"
[tasks.quality-evaluate]
run = "pnpm run quality:evaluate"
[tasks.quality-run]
run = "pnpm run quality:run"

[models.memory-zh]
source = "hf:Xenova/bge-small-zh-v1.5@75c43b069aac4d136ba6bc1122f995fedcfd2781"
include = ["config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json", "vocab.txt", "onnx/model_quantized.onnx"]
exclude = []
kind = "embedding"
family = "bge"
derived_from = "BAAI/bge-small-zh-v1.5"

[tasks."retrieval:index"]
run = [{ argv = ["bun", "scripts/retrieval-index.ts", "{{args}}"] }]

[tasks."retrieval:index".flags.review]
help = "Use the isolated repository database"

[tasks."review:verify"]
run = [{ argv = ["bun", "scripts/review-verify.ts", "{{args}}"] }]

[tasks."review:verify".flags.full]
help = "Run dependencies, complete project checks and live Chinese retrieval"

[tasks."review:build"]
run = [{ argv = ["bun", "scripts/review-wiki.ts", "{{args}}"] }]

[[tasks."review:build".args]]
name = "target"
default = ""
help = "File or directory to process; omit for all materials"

[tasks."review:build".flags.generate]
help = "Generate missing Wiki descriptions with the configured model"

[tasks."review:analyze"]
run = [{ argv = ["bun", "scripts/review-knowledge.ts", "{{args}}"] }]

[[tasks."review:analyze".args]]
name = "target"
default = ""
help = "File or directory to process; omit for all materials"

[tasks."review:analyze".flags.modules]
help = "Update affected modules and existing ancestors"

[tasks."review:analyze".flags.files-only]
help = "Only analyze source materials"

[tasks."review:analyze".flags.retry]
help = "Retry unfinished model work"

[tasks."review:generate"]
run = [{ argv = ["bun", "scripts/review-knowledge.ts", "{{args}}"] }]

[[tasks."review:generate".args]]
name = "target"
default = ""
help = "File or directory to process; omit for all materials"

[tasks."review:generate".flags.modules]
help = "Update affected modules and existing ancestors"

[tasks."review:generate".flags.files-only]
help = "Only analyze source materials"

[tasks."review:generate".flags.retry]
help = "Retry unfinished model work"
