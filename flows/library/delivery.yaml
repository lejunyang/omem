id: delivery
name: 需求交付
description: 一件需求从说清楚到上线：澄清、需要时先出方案、编码与评审、你推送、上线后的确认
for: { kinds: [todo] }
stages:
  - id: clarify
    name: 澄清
    note: 读这件事的材料和它所在的群、文档，把要做什么写成需求点（已有需求点就核对有没有变化），列出还没定的问题。拿不准的问本人，不要自己定。
    by: { run: { agent: assistant } }
    done: confirm
  - id: design
    name: 方案
    when: 改动跨模块、要动数据结构或对外接口，或者本人要求先出方案
    note: 给这件事写一份方案，交本人确认。
    by: { object: design }
  - id: code
    name: 编码
    note: 按确认过的需求点（有方案就按方案）发起交办，评审通过算完成。
    by: { object: code-work }
  - id: push
    name: 推送
    note: 评审通过的提交由你看过以后自己推送。
    by: owner
  - id: verify
    name: 上线确认
    note: 推送之后的发布和验证按你自己的做法进行。做完在这里记一笔，写上验证了什么。
    by: owner
