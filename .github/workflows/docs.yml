# The docs site (site/, VitePress) on GitHub Pages: built and published on every push to main
# that touches it. In the repository settings, Pages → Source must be “GitHub Actions”.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # “更新于” on each page comes from Git history
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # One lockfile for the workspace; only the docs site's dependencies are installed.
      - run: pnpm install --frozen-lockfile --filter omem-docs
      - run: pnpm --filter omem-docs run build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
